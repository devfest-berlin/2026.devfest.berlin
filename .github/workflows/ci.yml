name: CI (Build Verification)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Site
        run: npm run build

      # The legal pages must not go live with organizer details missing (see AGENTS.md, Legal pages)
      - name: Check Legal Pages Are Filled In
        run: |
          if grep -rl --include='*.html' 'class="todo-field"' _site; then
            echo "The pages above still show 'to be added' fields. Fill them in src/_data/site.json."
            exit 1
          fi
