<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="glow-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4285F4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EA4335" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EA4335" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBC04" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FBBC04" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34A853" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#34A853" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)" />
  <rect width="1920" height="1080" fill="url(#grid)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="200" r="500" fill="url(#glow-blue)" />
  <circle cx="1700" cy="300" r="450" fill="url(#glow-yellow)" />
  <circle cx="1400" cy="800" r="550" fill="url(#glow-red)" />
  <circle cx="400" cy="900" r="500" fill="url(#glow-green)" />

  <!-- DevFest Geometric Floating Accents -->
  <!-- Blue brackets -->
  <path d="M 280 320 L 220 400 L 280 480" fill="none" stroke="#4285F4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M 1640 600 L 1700 680 L 1640 760" fill="none" stroke="#EA4335" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <!-- Tech shapes -->
  <rect x="1500" y="240" width="80" height="80" rx="16" transform="rotate(25 1540 280)" fill="none" stroke="#FBBC04" stroke-width="8" opacity="0.3" />
  <circle cx="350" cy="750" r="40" fill="none" stroke="#34A853" stroke-width="8" opacity="0.3"/>
  <polygon points="1200,180 1230,230 1170,230" fill="none" stroke="#4285F4" stroke-width="8" opacity="0.3" transform="rotate(15 1200 205)"/>

  <!-- Berlin Skyline Silhouette (Bottom) -->
  <g fill="#0b0f19" opacity="0.85">
    <!-- Base city blocks -->
    <rect x="0" y="850" width="1920" height="230"/>
    <!-- Buildings -->
    <rect x="100" y="780" width="90" height="70" rx="4"/>
    <rect x="220" y="720" width="110" height="130" rx="4"/>
    <rect x="360" y="760" width="140" height="90" rx="4"/>
    <rect x="540" y="700" width="80" height="150" rx="4"/>
    <rect x="650" y="740" width="120" height="110" rx="4"/>
    <!-- Brandenburg Gate silhouette -->
    <rect x="800" y="750" width="180" height="100" rx="2"/>
    <rect x="820" y="720" width="140" height="30"/>
    <rect x="880" y="690" width="20" height="30"/>
    <!-- Berlin Fernsehturm (TV Tower) -->
    <rect x="1100" y="480" width="8" height="370"/>
    <circle cx="1104" cy="560" r="32"/>
    <line x1="1104" y1="360" x2="1104" y2="480" stroke="#0b0f19" stroke-width="4"/>
    <!-- More buildings -->
    <rect x="1180" y="720" width="130" height="130" rx="4"/>
    <rect x="1340" y="770" width="90" height="80" rx="4"/>
    <rect x="1460" y="690" width="100" height="160" rx="4"/>
    <rect x="1590" y="740" width="140" height="110" rx="4"/>
    <rect x="1760" y="780" width="100" height="70" rx="4"/>
  </g>
</svg>
